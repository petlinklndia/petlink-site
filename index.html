<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>PetLink | A little tag. A lot of love.</title>
<style>
:root{--bg:#090909;--panel:#171510;--gold:#d6b56d;--line:#493d29;--white:#f7f4ed;--muted:#b9b0a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#332817,#100f0d 55%,#080808);color:var(--white);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:540px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;padding:8px 3px 22px;align-items:center}.brand{font-weight:800;letter-spacing:.18em;font-size:20px}.brand span,.gold{color:var(--gold)}.tiny,.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1b1914,#10100f);overflow:hidden;box-shadow:0 20px 60px #0009}.pad{padding:24px}h1{font:36px Georgia,serif;font-weight:400;margin:10px 0}.intro{font-size:13px;color:var(--muted);line-height:1.6}
label{display:block;margin:15px 0 7px;font-size:12px;color:#e8d8b4}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #51452f;background:#0b0b0a;color:white;font:14px system-ui}textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;padding:15px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(110deg,#c4a15a,#f0d99d);font-weight:800;color:#17120a;cursor:pointer}.msg{font-size:13px;line-height:1.5;margin-top:15px;color:#efdaa6}.hero{height:280px;background:#201c15}.hero img{width:100%;height:100%;object-fit:cover}.identity{text-align:center;padding:22px}.petname{font:40px Georgia,serif;margin:8px}.sub{font-size:13px;color:var(--muted)}.details{padding:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px}.field small{display:block;color:#9d927e;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.field strong{font-size:14px}.section{margin:0 20px 18px;padding:15px;border:1px solid var(--line);border-radius:12px}.section h3{color:var(--gold);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.section p{font-size:13px;line-height:1.5;color:#ddd}.actions{padding:0 20px 22px}.actions a{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:linear-gradient(110deg,#c4a15a,#f0d99d);color:#17120a;font-weight:800;margin-top:9px}.actions a.alt{background:transparent;border:1px solid var(--line);color:#e8d8b4}.footer{text-align:center;color:#8f877a;font-size:10px;letter-spacing:.15em;margin-top:22px}.error{padding:35px;text-align:center}
</style></head><body><main class="wrap"><header class="top"><div class="brand">PET<span>LINK</span></div><div class="tiny">Digital pet identity</div></header><div id="app" class="card"></div><div class="footer">MADE WITH <span class="gold">♥</span> BY PETLINK</div></main>
<script>
const SUPABASE_URL="https://fmujvoyvgtmdqjzaudxm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Fa5O4AiPZWe9_QmlWjcQTQ_RebQBR9F";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headers={"apikey":SUPABASE_PUBLISHABLE_KEY};
function showForm(){app.innerHTML=`<div class="pad"><div class="eyebrow">WELCOME TO PETLINK</div><h1>Tell us about your pet.</h1><p class="intro">Share a few details and our team will prepare your personalised PetLink profile.</p>
<form id="f"><label>Pet's name *</label><input name="pet_name" required maxlength="60" placeholder="e.g. Bruno">
<label>Pet photograph</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp">
<div class="grid"><div><label>Animal type</label><select name="animal_type"><option value="">Select</option><option>Dog</option><option>Cat</option><option>Other</option></select></div><div><label>Gender</label><select name="gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div></div>
<div class="grid"><div><label>Breed</label><input name="breed"></div><div><label>Age</label><input name="age_text" placeholder="e.g. 2 years"></div></div>
<label>Your name *</label><input name="owner_name" required>
<label>Mobile number *</label><input name="phone" type="tel" required>
<label>WhatsApp number (optional)</label><input name="whatsapp" type="tel">
<label>City *</label><input name="city" required>
<label>Medical information (optional)</label><textarea name="medical_notes" placeholder="Only share information you are comfortable providing to PetLink."></textarea>
<div class="intro"><label style="display:flex;gap:9px;align-items:flex-start"><input type="checkbox" required style="width:auto;margin-top:3px"> I agree that PetLink may use these details to prepare my pet's profile and contact me about this order.</label></div>
<button class="btn">SUBMIT PET DETAILS</button><div id="msg" class="msg"></div></form></div>`;
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button"),m=document.getElementById("msg");b.disabled=true;b.textContent="SUBMITTING…";try{const r=await fetch(SUPABASE_URL+"/functions/v1/clever-handler",{method:"POST",headers,body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error||"Submission failed");e.target.reset();m.textContent="Thank you! We have received your details. The PetLink team will prepare your profile.";b.textContent="SUBMITTED";}catch(err){m.textContent=err.message;b.disabled=false;b.textContent="SUBMIT PET DETAILS";}}}
async function showPet(id){app.innerHTML='<div class="pad">Loading PetLink profile…</div>';try{const r=await fetch(SUPABASE_URL+"/functions/v1/view-pet",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({pet_id:id})});const d=await r.json();if(!r.ok)throw Error(d.error);const p=d.pet;app.innerHTML=`<div class="hero">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.pet_name)}">`:""}</div><div class="identity"><div class="eyebrow">${p.is_lost?"PET REPORTED LOST":"A PETLINK PROFILE"}</div><h1 class="petname">${esc(p.pet_name)}</h1><div class="sub">${esc(p.breed||p.animal_type||"Beloved companion")} ${p.age_text?"· "+esc(p.age_text):""}</div></div><div class="details"><div class="field"><small>Pet parent</small><strong>${esc(p.owner_name)}</strong></div><div class="field"><small>City</small><strong>${esc(p.city)}</strong></div></div>${p.public_medical_notes?`<div class="section"><h3>Health information</h3><p>${esc(p.public_medical_notes)}</p></div>`:""}${p.notes?`<div class="section"><h3>Helpful information</h3><p>${esc(p.notes)}</p></div>`:""}<div class="actions">${p.phone?`<a href="tel:${esc(p.phone)}">CALL PET PARENT</a>`:""}${p.whatsapp?`<a class="alt" href="https://wa.me/${esc(p.whatsapp.replace(/\D/g,''))}">WHATSAPP</a>`:""}</div>`}catch(e){app.innerHTML=`<div class="error"><h1>Profile unavailable</h1><p>${esc(e.message)}</p></div>`}}
if(!SUPABASE_URL.startsWith("https://")||SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_"))app.innerHTML='<div class="pad"><h1>Website setup needed</h1><p class="intro">Add your Supabase Project URL and Publishable Key in this file before publishing.</p></div>';else{const id=new URLSearchParams(location.search).get("pet");id?showPet(id):showForm();}
</script></body></html>
