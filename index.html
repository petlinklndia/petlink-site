<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10130f">
<title>PetLink | A little tag. A lot of love.</title>
<style>
:root{--bg:#10130f;--panel:#191d17;--panel2:#22271f;--gold:#e0bf75;--cream:#fff8e9;--muted:#b8b6a8;--line:rgba(224,191,117,.25);--mint:#b9d7b6;--coral:#f0a08b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#35402c 0,#171d16 38%,#0c0f0c 78%);color:var(--cream);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#f1d99f .8px,transparent .8px);background-size:22px 22px}
.wrap{position:relative;max-width:680px;margin:auto;padding:22px 16px 42px}.top{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 18px}
.brand{font-weight:900;letter-spacing:.2em;font-size:19px}.brand span{color:var(--gold)}.tiny{font-size:9px;letter-spacing:.19em;color:var(--gold);text-transform:uppercase;font-weight:800}
.footer{text-align:center;color:#918f80;font-size:10px;letter-spacing:.16em;margin:22px 0 0}.footer b{color:var(--gold)}
.card{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#1c2019,#11140f);overflow:hidden;box-shadow:0 28px 90px #0009,0 0 45px #e0bf7510}
.pad{padding:24px}h1{font:400 36px Georgia,serif;margin:10px 0}.intro{font-size:13px;color:var(--muted);line-height:1.6}
label{display:block;margin:15px 0 7px;font-size:12px;color:#e8d8b4}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #51452f;background:#0b0b0a;color:white;font:14px system-ui}
textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-btn{width:100%;padding:15px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(110deg,#c4a15a,#f0d99d);font-weight:800;color:#17120a;cursor:pointer}
.msg{font-size:13px;line-height:1.5;margin-top:15px;color:#efdaa6}

/* Premium individual pet identity */
.pet-page{position:relative}
.hero{height:420px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% 35%,#65734b,#273629 55%,#111710)}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:photoIn 1.2s cubic-bezier(.2,.7,.2,1) both;transform:scale(1.015)}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,10,7,.2),rgba(6,10,7,.02) 35%,rgba(6,10,7,.18) 52%,rgba(6,10,7,.93) 100%)}
.hero-top{position:absolute;top:17px;left:17px;right:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.glass{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:99px;border:1px solid #ffffff45;background:#101710a8;backdrop-filter:blur(12px);color:#fff5d9;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.glass .dot{width:7px;height:7px;background:#a7d49a;border-radius:50%;box-shadow:0 0 12px #a7d49a}
.hero-copy{position:absolute;bottom:24px;left:22px;right:22px;text-align:center}
.eyebrow{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:900}
.pet-name{font:400 clamp(44px,10vw,66px)/1 Georgia,serif;margin:10px 0 8px;color:#fff8e9;text-shadow:0 4px 28px #000b}
.pet-sub{font-size:13px;color:#f2e8cf;letter-spacing:.06em}
.boop-hint{display:inline-flex;align-items:center;gap:6px;margin-top:13px;padding:8px 12px;border-radius:99px;background:#fff2d91c;border:1px solid #fff3d633;color:#fff2d9;font-size:10px;animation:hint 2.4s ease-in-out infinite}
.float-paw{position:absolute;z-index:1;color:#fff1c5;opacity:0;pointer-events:none;animation:floatUp 4.5s ease-in infinite;text-shadow:0 0 12px #f2d58b}
.paw1{left:12%;bottom:30%;font-size:21px;animation-delay:.3s}.paw2{right:13%;bottom:38%;font-size:16px;animation-delay:1.7s}.paw3{left:28%;bottom:52%;font-size:13px;animation-delay:2.8s}
.spark{position:absolute;color:#ffe7a4;z-index:1;animation:twinkle 2.5s ease-in-out infinite}.sp1{top:25%;left:14%;font-size:17px}.sp2{top:36%;right:17%;font-size:13px;animation-delay:.9s}.sp3{top:18%;right:31%;font-size:11px;animation-delay:1.5s}
.profile-body{padding:0 20px 25px}
.welcome-strip{margin:0 -20px;padding:14px 12px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#b68d45,#f0d99d,#b68d45);color:#241d10;font-size:10px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}
.welcome-strip span{display:inline-block;animation:heartBeat 1.6s infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}
.stat{padding:15px 7px;text-align:center;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#ffffff0d,#ffffff03);animation:rise .7s both}
.stat:nth-child(2){animation-delay:.12s}.stat:nth-child(3){animation-delay:.24s}
.stat .emoji{font-size:19px;display:block;margin-bottom:7px}.stat strong{display:block;color:#fff3d5;font-size:13px;margin-bottom:4px}.stat small{display:block;color:#aaa58f;font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.section-title{display:flex;align-items:center;gap:9px;margin:23px 0 12px;font:22px Georgia,serif;color:#f5e8ca}
.section-title .icon{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#e0bf751b;border:1px solid var(--line);font:16px system-ui}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.info{padding:14px;border:1px solid #ffffff17;border-radius:15px;background:#ffffff08;min-width:0}
.info small{display:block;color:#aaa58f;font-size:8px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px;font-weight:800}.info strong{font-size:13px;color:#fff5e1;font-weight:700;overflow-wrap:anywhere}
.love-note{position:relative;margin-top:18px;padding:19px 17px;border:1px solid #e0bf7545;border-radius:17px;background:linear-gradient(135deg,#e0bf7517,#ffffff05);text-align:center;overflow:hidden}
.love-note:before{content:"✦  ✧  ✦";display:block;color:var(--gold);letter-spacing:.6em;font-size:11px;margin-bottom:9px}
.love-note p{margin:0;color:#e9dfca;font:italic 16px/1.5 Georgia,serif}.love-note small{display:block;margin-top:10px;color:#b8a77f;font-size:8px;letter-spacing:.18em;text-transform:uppercase}
.note{padding:15px;border-radius:15px;border:1px solid var(--line);background:#e0bf750d;font-size:13px;line-height:1.65;color:#e9dfca}
.lost{margin:15px 0;padding:16px;border-radius:15px;background:linear-gradient(100deg,#782f25,#3d1b18);border:1px solid #d77963;color:#fff0e8;text-align:center;font-weight:900;letter-spacing:.06em;animation:lostPulse 2s infinite}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.actions a{display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;text-align:center;padding:15px 10px;border-radius:14px;background:linear-gradient(110deg,#bd984f,#f0d99d);color:#211a0d;font-size:11px;font-weight:1000;letter-spacing:.06em;transition:transform .2s,filter .2s}
.actions a:hover{transform:translateY(-3px);filter:brightness(1.08)}.actions a.alt{background:transparent;border:1px solid #e0bf7570;color:#f1dfb6}
.share-row{text-align:center;margin-top:17px}.share-btn{border:0;background:none;color:#bdb39c;text-decoration:underline;text-underline-offset:4px;font:11px system-ui;cursor:pointer}
.error{padding:35px;text-align:center}
.burst{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:burst 950ms ease-out forwards}
@keyframes photoIn{from{opacity:.4;transform:scale(1.09)}to{opacity:1;transform:scale(1.015)}}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(18deg)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(18px) rotate(-10deg)}20%{opacity:.5}85%{opacity:.35}100%{opacity:0;transform:translateY(-105px) rotate(15deg)}}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-3px);opacity:1}}
@keyframes heartBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}}
@keyframes lostPulse{0%,100%{box-shadow:0 0 0 0 #d7796300}50%{box-shadow:0 0 0 5px #d7796322}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(35deg) scale(1.35)}}
@media(max-width:520px){.hero{height:365px}.profile-body{padding:0 14px 21px}.welcome-strip{margin:0 -14px}.stats{gap:6px}.stat{padding:12px 4px}.stat strong{font-size:12px}.actions{grid-template-columns:1fr}.hero-copy{left:14px;right:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">PET<span>LINK</span></div><div class="tiny">Digital pet identity</div></header>
<div id="app" class="card"></div><div class="footer">MADE WITH <b>♥</b> BY PETLINK</div>
</main>
<script>
const SUPABASE_URL="https://fmujvoyvgtmdqjzaudxm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Fa5O4AiPZWe9_QmlWjcQTQ_RebQBR9F";
const app=document.getElementById("app"),headers={"apikey":SUPABASE_PUBLISHABLE_KEY};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showForm(){app.innerHTML=`<div class="pad"><div class="eyebrow">WELCOME TO PETLINK</div><h1>Tell us about your pet.</h1><p class="intro">Share a few details and our team will prepare your personalised PetLink profile.</p><form id="f">
<label>Pet's name *</label><input name="pet_name" required maxlength="60" placeholder="e.g. Bruno"><label>Pet photograph</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp">
<div class="grid"><div><label>Animal type</label><select name="animal_type"><option value="">Select</option><option>Dog</option><option>Cat</option><option>Other</option></select></div><div><label>Gender</label><select name="gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div></div>
<div class="grid"><div><label>Breed</label><input name="breed"></div><div><label>Age</label><input name="age_text" placeholder="e.g. 2 years"></div></div>
<label>Your name *</label><input name="owner_name" required><label>Mobile number *</label><input name="phone" type="tel" required><label>WhatsApp number (optional)</label><input name="whatsapp" type="tel"><label>City *</label><input name="city" required>
<label>Medical information (optional)</label><textarea name="medical_notes" placeholder="Only share information you are comfortable providing to PetLink."></textarea>
<div class="intro"><label style="display:flex;gap:9px;align-items:flex-start"><input type="checkbox" required style="width:auto;margin-top:3px"> I agree that PetLink may use these details to prepare my pet's profile and contact me about this order.</label></div>
<button class="form-btn">SUBMIT PET DETAILS</button><div id="msg" class="msg"></div></form></div>`;
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button"),m=document.getElementById("msg");b.disabled=true;b.textContent="SUBMITTING…";try{const r=await fetch(SUPABASE_URL+"/functions/v1/clever-handler",{method:"POST",headers,body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error||"Submission failed");e.target.reset();m.textContent="Thank you! We have received your details. The PetLink team will prepare your profile.";b.textContent="SUBMITTED";}catch(err){m.textContent=err.message;b.disabled=false;b.textContent="SUBMIT PET DETAILS";}}}
function burstAt(x,y){const symbols=["♥","✦","🐾","✨"];for(let i=0;i<9;i++){const el=document.createElement("span");el.className="burst";el.textContent=symbols[i%symbols.length];el.style.left=x+"px";el.style.top=y+"px";el.style.color=i%2?"#f0d99b":"#f3b4a2";el.style.setProperty("--dx",(Math.random()*150-75)+"px");el.style.setProperty("--dy",(Math.random()*-140-25)+"px");document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}}
async function showPet(id){app.innerHTML='<div class="pad">Getting the tail-wagging details…</div>';try{
const r=await fetch(SUPABASE_URL+"/functions/v1/view-pet",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({pet_id:id})});const d=await r.json();if(!r.ok)throw Error(d.error||"This pet profile is not available yet.");const p=d.pet;
const age=p.age_text?esc(p.age_text):"—",type=p.animal_type||"Pet";
const photo=p.photo_url?`<img class="hero-photo" src="${esc(p.photo_url)}" alt="${esc(p.pet_name)}">`:"";
const contacts=`${p.phone?`<a href="tel:${esc(p.phone)}">☎ <span>CALL MY HUMAN</span></a>`:""}${p.whatsapp?`<a class="alt" target="_blank" rel="noopener" href="https://wa.me/${esc(String(p.whatsapp).replace(/\D/g,''))}">✆ <span>WHATSAPP</span></a>`:""}`;
app.className="card pet-page";
app.innerHTML=`<section class="hero">${photo}<span class="float-paw paw1">🐾</span><span class="float-paw paw2">🐾</span><span class="float-paw paw3">✧</span><span class="spark sp1">✦</span><span class="spark sp2">✧</span><span class="spark sp3">✦</span>
<div class="hero-top"><span class="glass"><i class="dot"></i> PETLINK IDENTITY</span><span class="glass">${esc(type)}</span></div>
<div class="hero-copy"><div class="eyebrow">THE WORLD'S LUCKIEST HUMAN HAS ME</div><h1 class="pet-name">${esc(p.pet_name)}</h1><div class="pet-sub">${esc(p.breed||type)}${p.age_text?" · "+age:""}</div><div class="boop-hint">☝️ Tap my photo for a little love</div></div></section>
<div class="profile-body"><div class="welcome-strip"><span>♥</span> A LITTLE TAG. A LOT OF LOVE <span>♥</span></div>
<div class="stats"><div class="stat"><span class="emoji">🐾</span><strong>${esc(p.gender||"—")}</strong><small>My style</small></div><div class="stat"><span class="emoji">🎂</span><strong>${age}</strong><small>My age</small></div><div class="stat"><span class="emoji">🏡</span><strong>${esc(p.city||"—")}</strong><small>My hometown</small></div></div>
${p.is_lost?'<div class="lost">🚨 I’M LOST — PLEASE HELP ME GET HOME. CONTACT MY HUMAN BELOW.</div>':""}
<div class="section-title"><span class="icon">💛</span> My favourite human</div><div class="info-grid"><div class="info"><small>My person</small><strong>${esc(p.owner_name||"My favourite human")}</strong></div><div class="info"><small>My breed</small><strong>${esc(p.breed||"One of a kind")}</strong></div></div>
<div class="love-note"><p>“I may only be part of your world, but you're my whole world.”</p><small> A little note from the PetLink family </small></div>
${p.public_medical_notes?`<div class="section-title"><span class="icon">🩺</span> My care notes</div><div class="note">${esc(p.public_medical_notes)}</div>`:""}
${p.notes?`<div class="section-title"><span class="icon">✨</span> More about me</div><div class="note">${esc(p.notes)}</div>`:""}
${contacts?`<div class="actions">${contacts}</div>`:""}
<div class="share-row"><button class="share-btn" id="share">↗ Share my PetLink profile</button></div>
</div>`;
const hero=app.querySelector(".hero");hero.addEventListener("click",e=>burstAt(e.clientX,e.clientY));
document.getElementById("share").addEventListener("click",async()=>{const data={title:p.pet_name+" | PetLink",text:"Meet "+p.pet_name+"'s PetLink profile!",url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);document.getElementById("share").textContent="✓ Profile link copied!"}}catch(_){}});
}catch(e){app.className="card";app.innerHTML=`<div class="error"><h1>Profile unavailable</h1><p>${esc(e.message)}</p></div>`;}}
const id=new URLSearchParams(location.search).get("pet");if(id)showPet(id);else showForm();
</script></body></html>
